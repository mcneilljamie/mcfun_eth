<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <rect width="1200" height="630" fill="#111827"/>
  <rect width="1200" height="630" fill="url(#gradient)"/>

  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>

  <!-- MF Logo -->
  <rect x="475" y="180" width="250" height="250" rx="24" fill="white"/>
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="#111827" text-anchor="middle" dominant-baseline="middle">MF</text>

  <!-- McFun Text -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">McFun</text>

  <!-- Tagline -->
  <text x="600" y="540" font-family="Arial, sans-serif" font-size="32" fill="#9CA3AF" text-anchor="middle">Launch Your Token</text>
</svg>
