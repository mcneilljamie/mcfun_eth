<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
    .container {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }
    .logo {
      width: 250px;
      height: 250px;
      background: white;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .logo-text {
      font-size: 140px;
      font-weight: bold;
      color: #111827;
      line-height: 1;
    }
    .tagline {
      font-size: 56px;
      font-weight: 600;
      color: #E5E7EB;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-text">MF</div>
    </div>
    <div class="tagline">Launch Your Token</div>
  </div>
</body>
</html>
